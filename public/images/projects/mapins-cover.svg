<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <!-- Обложка Мапинс: упрощённый редактор карты — структура, план этажа, оповещения и карточка объекта. Палитра — как у обложки «Смарт». -->
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d1e3ee"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#12394c" flood-opacity="0.07"/></filter>
    <filter id="pop" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#12394c" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1000" height="620" fill="#f3f8fb"/>
  <rect width="1000" height="620" fill="url(#dots)"/>

  <!-- окно редактора -->
  <rect x="80" y="78" width="840" height="464" rx="20" fill="#ffffff" filter="url(#shadow)"/>

  <!-- шапка: этаж, инструменты, «Поделиться» -->
  <rect x="104" y="96" width="82" height="28" rx="14" fill="#e3eff6"/>
  <text x="118" y="115" font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#226889">1 этаж ▾</text>
  <g fill="none" stroke="#90bcd4" stroke-width="1.5">
    <rect x="212" y="99" width="22" height="22" rx="4"/><path d="M212 106.5h22M212 113.5h22M219 99v7.5M227 106.5v7M219 113.5v7.5"/>
    <rect x="246" y="99" width="22" height="22" rx="4"/>
    <rect x="280" y="99" width="22" height="22" rx="4" stroke-dasharray="3 2.5"/>
    <rect x="314" y="99" width="22" height="22" rx="4"/><path d="M320 110h10M325 105v10"/>
    <path d="M352 99v22"/>
    <rect x="366" y="99" width="22" height="22" rx="4"/><path d="M370 115l6-6 4 4 4-6"/>
  </g>
  <rect x="772" y="96" width="124" height="28" rx="14" fill="#226889"/>
  <text x="834" y="115" text-anchor="middle" font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Поделиться</text>
  <line x1="80" y1="142" x2="920" y2="142" stroke="#e5e5e5"/>

  <!-- структура карты -->
  <line x1="280" y1="142" x2="280" y2="542" stroke="#e5e5e5"/>
  <text x="104" y="172" font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#282828">Структура карты</text>
  <rect x="96" y="186" width="170" height="28" rx="8" fill="#f3f8fb" stroke="#90bcd4"/>
  <rect x="106" y="193" width="14" height="14" rx="2" fill="none" stroke="#78acc8" stroke-dasharray="3 2"/>
  <text x="130" y="205" font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#282828">Опенспейс</text>
  <g font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#555555">
    <path d="M136 228l5 5-5 5-5-5z" fill="none" stroke="#90bcd4" stroke-width="1.3"/><text x="150" y="238">Стол 2</text>
    <path d="M136 254l5 5-5 5-5-5z" fill="#4f98bc"/><text x="150" y="264" fill="#226889" font-weight="600">Ноутбук</text>
    <path d="M136 280l5 5-5 5-5-5z" fill="none" stroke="#90bcd4" stroke-width="1.3"/><text x="150" y="290">Кресло</text>
  </g>
  <g font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#282828">
    <rect x="106" y="309" width="14" height="14" rx="2" fill="none" stroke="#b9c6ce" stroke-dasharray="3 2"/><text x="130" y="321">Переговорная</text>
    <rect x="106" y="339" width="14" height="14" rx="2" fill="none" stroke="#b9c6ce" stroke-dasharray="3 2"/><text x="130" y="351">Кухня</text>
  </g>
  <rect x="106" y="378" width="120" height="9" rx="4.5" fill="#efefef"/>
  <rect x="106" y="398" width="88" height="9" rx="4.5" fill="#efefef"/>
  <text x="106" y="514" font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#4f98bc">+ Добавить зону</text>

  <!-- план этажа: зоны -->
  <rect x="316" y="168" width="280" height="120" fill="#ffffff"/>
  <rect x="596" y="168" width="288" height="120" fill="#e3eff6"/>
  <rect x="316" y="288" width="568" height="224" fill="#edf7f1"/>

  <!-- мебель -->
  <rect x="332" y="184" width="120" height="24" rx="3" fill="#dfe5e9"/>
  <rect x="546" y="184" width="34" height="40" rx="3" fill="#dfe5e9"/>
  <rect x="664" y="204" width="148" height="46" rx="23" fill="#c4d9e6"/>
  <g fill="#a9c7d8">
    <circle cx="690" cy="190" r="7"/><circle cx="738" cy="190" r="7"/><circle cx="786" cy="190" r="7"/>
    <circle cx="690" cy="264" r="7"/><circle cx="738" cy="264" r="7"/><circle cx="786" cy="264" r="7"/>
  </g>
  <g fill="#d6dde2">
    <rect x="360" y="330" width="90" height="46" rx="4"/>
    <rect x="470" y="330" width="90" height="46" rx="4"/>
    <rect x="580" y="330" width="90" height="46" rx="4"/>
    <circle cx="790" cy="410" r="18"/>
  </g>
  <rect x="742" y="452" width="104" height="38" rx="12" fill="#c9d6dd"/>
  <g fill="#b9c6ce">
    <circle cx="405" cy="392" r="10"/><circle cx="515" cy="392" r="10"/><circle cx="625" cy="392" r="10"/>
  </g>
  <rect x="500" y="340" width="30" height="18" rx="2" fill="#5f6b74"/>
  <rect x="496" y="358" width="38" height="4" rx="2" fill="#8a959c"/>

  <!-- стены и двери -->
  <g stroke="#3a3a3a" stroke-width="6" stroke-linecap="square" fill="none">
    <rect x="316" y="168" width="568" height="344"/>
    <path d="M316 288H390M434 288H688M732 288H884M596 168V288"/>
  </g>
  <g stroke="#3a3a3a" stroke-width="4" stroke-linecap="round">
    <path d="M434 288L410 264"/><path d="M732 288L708 264"/>
  </g>

  <!-- выбранный объект и его карточка -->
  <rect x="463" y="323" width="104" height="60" rx="6" fill="none" stroke="#4f98bc" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M470 384L480 404H460Z" fill="#ffffff"/>
  <rect x="336" y="402" width="214" height="100" rx="12" fill="#ffffff" filter="url(#pop)"/>
  <g font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif">
    <text x="352" y="428" font-size="14" font-weight="600" fill="#282828">Ноутбук</text>
    <text x="476" y="428" font-size="11" font-weight="600" fill="#4f98bc">Изменить</text>
    <line x1="352" y1="440" x2="534" y2="440" stroke="#efefef"/>
    <text x="352" y="462" font-size="12" fill="#777777">Владелец</text>
    <text x="438" y="462" font-size="12" fill="#282828">Отдел продаж</text>
    <text x="352" y="486" font-size="12" fill="#777777">Приобретён</text>
    <text x="438" y="486" font-size="12" fill="#282828">дек 2023</text>
  </g>

  <!-- оповещения: предупреждение у двери и экстренное на столе -->
  <circle cx="710" cy="304" r="11" fill="#f2b84b" stroke="#ffffff" stroke-width="3"/>
  <text x="710" y="309" text-anchor="middle" font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">!</text>
  <path d="M724 310L740 318H728Z" fill="#fff8e6"/>
  <rect x="728" y="314" width="170" height="52" rx="12" fill="#fff8e6" stroke="#f0d48a" filter="url(#pop)"/>
  <g font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif">
    <text x="744" y="337" font-size="13" font-weight="600" fill="#282828">Проход закрыт</text>
    <text x="744" y="355" font-size="11" fill="#777777">Анна К. · 5 мин назад</text>
  </g>
  <circle cx="664" cy="336" r="11" fill="#d0584f" stroke="#ffffff" stroke-width="3"/>
  <text x="664" y="341" text-anchor="middle" font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">!</text>
</svg>
